# CITIMART Daily Operations -- L7 gateway / load balancer (docker-compose.yml).
#
#   /api/*  -> least_conn across every `backend` replica (Docker DNS)
#   /*      -> the built SPA (../frontend/dist, mounted read-only)
#
# Deliberately NOT micro-cached: anything under /api except /api/health.
# Every other /api response is per-user and authenticated; a proxy cache
# keyed without the Authorization header would hand one user's (or an
# unauthenticated caller's) request another user's response.

worker_processes auto;
events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 30s;

    # Re-resolve `backend` so `docker compose up --scale backend=N` changes
    # are picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream citimart_backend {
        least_conn;
        zone citimart_backend 64k;
        server backend:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # Edge abuse shield (API-02 / INFRA-08), in C before Python sees the
    # request. The app enforces the real per-IP / per-account login limits
    # in Redis; these are generous ceilings sized for a whole store network
    # behind one NAT. Tune per deployment.
    limit_req_zone $binary_remote_addr zone=api_zone:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=100r/s;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:1m max_size=10m inactive=10s use_temp_path=off;

    server {
        listen 80;
        # TLS (WEB-01): mount certs and enable, then redirect :80 -> :443.
        # listen 443 ssl;
        # http2 on;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 11m;   # 10 MB Excel target upload cap + multipart overhead (API-03)
        client_body_timeout 15s;

        # WEB-02 / WEB-04 for everything nginx serves itself (the SPA).
        # The API sets the same headers in app.py's SecurityHeadersMiddleware.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Enable once served over HTTPS:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        location = /api/health {
            proxy_cache micro;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_pass http://citimart_backend;
        }

        location = /api/auth/login {
            limit_req zone=login_zone burst=2000 nodelay;
            proxy_next_upstream off;  # never replay a login attempt
            proxy_pass http://citimart_backend;
        }

        # Synchronous report export renders PDFs inline; slow ones should use
        # POST /api/daily/report/jobs (BullMQ) instead of a longer timeout.
        location = /api/daily/report {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_read_timeout 120s;
            proxy_pass http://citimart_backend;
        }

        location /api/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://citimart_backend;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri /index.html;
        }
    }
}
